[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onlinepayments-sdk-python3"
dynamic = ["version"]
description = "SDK to communicate with the Online Payments platform using the Online Payments Server API"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Online Payments", email = "96182451+online-payments-support-team@users.noreply.github.com" },
]
keywords = ["Online Payments SDK"]
requires-python = ">=3.11"
dependencies = [
    "requests >= 2.32.3",
    "requests-toolbelt >= 1.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
test = [
    "pytest >= 8",
    "pytest-cov",
    "python-dotenv >= 1.0",
    "responses",
]

[project.urls]
Homepage = "https://github.com/Online-Payments/sdk-python3"

[tool.setuptools.dynamic]
version = { attr = "onlinepayments.sdk._version.__version__" }

[tool.setuptools.packages.find]
include = ["onlinepayments", "onlinepayments.*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
# the agent skill, generated by sdk-agent-skill, and AGENTS.md that points agents to it
"onlinepayments.sdk" = [
    "AGENTS.md",
    "skills/*/*.md",
    "skills/*/references/*.md",
    "skills/*/examples/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests, no network needed",
    "integration: integration tests against the real API, need credentials",
]

[tool.ruff]
target-version = "py311"
extend-exclude = [
    "conf.py",
    "tests",
    "onlinepayments/sdk/client.py",
    "onlinepayments/sdk/i_client.py",
    "onlinepayments/sdk/exception_factory.py",
    "onlinepayments/sdk/api_exception.py",
    "onlinepayments/sdk/authorization_exception.py",
    "onlinepayments/sdk/declined_payment_exception.py",
    "onlinepayments/sdk/declined_payout_exception.py",
    "onlinepayments/sdk/declined_refund_exception.py",
    "onlinepayments/sdk/declined_transaction_exception.py",
    "onlinepayments/sdk/idempotence_exception.py",
    "onlinepayments/sdk/platform_exception.py",
    "onlinepayments/sdk/problem_details_exception.py",
    "onlinepayments/sdk/reference_exception.py",
    "onlinepayments/sdk/validation_exception.py",
    "onlinepayments/sdk/domain",
    "onlinepayments/sdk/merchant",
    "onlinepayments/sdk/webhooks/webhooks_helper.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["onlinepayments"]
exclude = [
    '^onlinepayments/sdk/client\.py$',
    '^onlinepayments/sdk/i_client\.py$',
    '^onlinepayments/sdk/exception_factory\.py$',
    '^onlinepayments/sdk/[a-z_]+_exception\.py$',
    '^onlinepayments/sdk/domain/',
    '^onlinepayments/sdk/merchant/',
    '^onlinepayments/sdk/webhooks/webhooks_helper\.py$',
]
follow_imports = "silent"
ignore_missing_imports = true
